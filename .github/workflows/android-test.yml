name: Android unit-tests

on:
  pull_request:
    paths:
      - "app/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
      - ".github/workflows/android-test.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # De unit-tests hebben geen echte Firebase nodig; de plugin wil alleen een geldig bestand.
      - name: Dummy google-services.json plaatsen
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {"project_number": "1", "project_id": "test", "storage_bucket": "test.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:1:android:1", "android_client_info": {"package_name": "nl.spellenweekend.app"}},
              "api_key": [{"current_key": "test"}]
            }],
            "configuration_version": "1"
          }
          JSON

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-tests
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace
