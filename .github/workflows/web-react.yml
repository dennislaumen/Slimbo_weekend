name: Web React prototype

on:
  pull_request:
    paths:
      - "web-react/**"
      - "web/app/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/web-react.yml"
  push:
    branches: [main]
    paths:
      - "web-react/**"
      - "web/app/**"
      - "firestore.rules"
      - "firebase.json"
      - ".github/workflows/web-react.yml"

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web-react/package-lock.json
      - uses: actions/setup-java@v4 # the Firebase emulators need Java 21+
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # typecheck, lint, Vitest, fake build, Playwright flows
      - run: npm run check
      # Pixel parity with the legacy web/app/index.html
      - run: npm run test:visual
      # Real SDK and real firestore.rules on the emulators
      - run: npm run test:emulator
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-react-test-results
          path: web-react/test-results
